name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --production
      - run: node -e "import('./introspection-server.mjs').then(() => { setTimeout(() => process.exit(0), 2000); })"
